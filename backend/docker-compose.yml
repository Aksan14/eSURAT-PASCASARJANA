services:
  postgres:
    image: postgres:16-alpine
    container_name: persuratan-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-persuratan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-persuratan}
      POSTGRES_DB: ${DB_NAME:-persuratan}
      TZ: Asia/Makassar
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-persuratan} -d ${DB_NAME:-persuratan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: persuratan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migrasi dijalankan sebagai job sekali jalan sebelum backend start.
  migrate:
    build: .
    command: ["/app/migrate", "up"]
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    container_name: persuratan-backend
    command: ["/app/server"]
    env_file: .env
    environment:
      DB_HOST: postgres
      AUTO_MIGRATE: "false"
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio:9000
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
